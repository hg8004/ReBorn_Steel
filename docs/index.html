<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리본스틸 사내포털</title>
<meta name="description" content="가상 기업 리본스틸의 사내 포털: 신입 배합 담당의 오늘 할 일과 메일 (수업 과제, 모든 데이터는 가상)">
<link rel="icon" href="assets/rebo-face.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/portal.css?v=20261122d">
<style>
/* 홈: 왼쪽 오늘 할 일, 오른쪽 미션·리보 (높이 맞춤) */
.daybox { display: grid; justify-items: end; gap: 2px; background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 12px 18px; min-width: 132px; }
.daybox span { font-size: var(--fs-sm); opacity: .85; font-weight: 600; }
.daybox b { font-size: var(--fs-kpi); line-height: 1.1; letter-spacing: -.02em; white-space: nowrap; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: var(--gap); align-items: stretch; }
.home-side { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.home-side > .card:last-child { flex: 1; }
.prog { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600; }
.prog .track { width: 120px; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--good); }
.mission { background: var(--cream); border-color: #f3d9bf; border-left: 4px solid var(--point); }
.mission .top { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.mission img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--surface); }
.mission h2 { color: var(--point-ink); }
.mission p { font-size: var(--fs-md); color: var(--ink-2); line-height: 1.6; }
.mission .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.welcome { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; align-items: start; }
.welcome img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; background: #eef3ee; }
.bubble { position: relative; background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: var(--fs-md); line-height: 1.55; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 18px; border: 8px solid transparent; border-left: 0; border-right-color: var(--accent-soft); }
.duties { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: var(--fs-md); display: grid; gap: 4px; }
.tile.alert { box-shadow: inset 4px 0 0 var(--point), var(--shadow); }
@media (max-width: 1100px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 768px) { .daybox { justify-items: start; } .welcome { grid-template-columns: 64px minmax(0, 1fr); } .welcome img { width: 64px; height: 64px; } }
</style>
</head>
<body data-page="home">
<header id="topbar"></header>
<div class="shell">
<nav class="side" id="side" aria-label="사내 메뉴"></nav>
<main>
  <div class="headpic has-aside">
    <img src="assets/rebo-face.png" alt="">
    <div class="pagehead">
      <div class="eyebrow" id="today"></div>
      <h1 id="hello">사내포털</h1>
      <p id="job"></p>
    </div>
    <div class="daybox"><span>입사</span><b id="dayNo">-</b></div>
  </div>

  <div class="home-grid">
    <section class="card" aria-labelledby="taskT">
      <div class="card-h"><h2 id="taskT">오늘 할 일</h2><div class="prog"><span class="track"><i id="taskBar" style="width:0%"></i></span><span class="num" id="taskCount"></span></div></div>
      <ul class="tasks" id="tasks"></ul>
      <p class="card-foot">할 일은 사내 메일에서 자동으로 생겨요. 체크 표시는 이 브라우저에만 저장돼요.</p>
    </section>
    <div class="home-side">
      <section class="card mission" id="missionCard" aria-labelledby="msT"></section>
      <section class="card" aria-labelledby="meT">
        <div class="welcome">
          <img id="reboPic" src="assets/brand/rebo-hello.jpg" alt="">
          <div style="display:grid;gap:12px">
            <div class="bubble" id="bubble"></div>
            <div style="display:grid;gap:6px"><h2 id="meT" style="font-size:var(--fs-base)">내 직무: 스크랩 배합 담당</h2><ul class="duties" id="duties"></ul></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <section style="display:grid;gap:14px" aria-labelledby="opsT">
    <div class="section-h"><h2 id="opsT">오늘 조업 한눈에</h2><a href="ops.html" id="opsLink">조업 현황 자세히 →</a></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <div class="grid2">
    <section class="card" aria-labelledby="mailT">
      <div class="card-h"><h2 id="mailT">받은 메일</h2><a href="mail.html">메일함 열기 →</a></div>
      <ul class="mini" id="mails"></ul>
    </section>
    <section class="card" aria-labelledby="noticeT">
      <div class="card-h"><h2 id="noticeT">전사 공지</h2><a href="company.html#notices">전체 보기 →</a></div>
      <ul class="mini" id="notices"></ul>
    </section>
  </div>

  <p class="disclaimer">리본스틸㈜은 인공지능재료공학 수업 과제용으로 만든 가상 기업이에요. 직원, 메일, 공지, 조업 데이터는 모두 가상입니다.</p>
</main>
</div>

<script src="data/results.js?v=20261122d"></script>
<script src="data/company.js?v=20261122d"></script>
<script src="assets/portal.js?v=20261122d"></script>
<script>
(function () {
  "use strict";
  var P = window.Portal; if (!P || !P.D) return;
  var $ = P.$, esc = P.esc;
  var PICS = { hello: ["rebo-hello.jpg", "손을 들어 인사하는 리보"], earth: ["rebo-earth.jpg", "지구를 안고 웃는 리보"],
               safety: ["rebo-safety.jpg", "안전조끼를 입고 무전기를 든 리보"] };

  function render(c) {
    var u = c.user, notice = P.noticeFor(c.date), S = P.sheetFor(c.date), f = S.summary;   // 통지한 배합이 있으면 그것 기준
    $("today").textContent = c.date + " (" + P.dow(c.date) + ") · " + P.JOB.dept + " " + u.team;
    $("hello").textContent = (c.day === 1 ? "입사를 환영해요, " : "좋은 아침이에요, ") + u.name + " 사원님";
    $("job").textContent = P.JOB.roleLong + " · 사수 한지수 대리";
    $("dayNo").textContent = c.day + "일차";
    $("duties").innerHTML = u.duties.map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("");

    // 오늘의 미션
    var ms = P.missionFor(c.date), sub = P.getSubmit(c.date), mr = sub && P.checkMission(c.date, sub);
    $("missionCard").innerHTML = '<div class="top"><img src="assets/brand/' + ms.pic + '" alt=""><div style="display:grid;gap:2px"><div class="eyebrow" style="color:var(--point-ink)">오늘의 미션</div>' +
      '<h2 id="msT">' + esc(ms.title) + "</h2></div></div>" +
      "<p>" + esc(ms.story) + "</p>" +
      '<div class="foot">' + (mr ? (mr.ok ? '<span class="pill good">✓ 미션 성공</span>' : '<span class="pill warn">보완 필요</span>') : '<span class="pill info">진행 전</span>') +
      '<a class="btn accent" href="history.html?date=' + c.date + '">' + (sub ? "결재 다시 보기" : "미션 시작 →") + "</a></div>";

    // 오늘 할 일 = 기준일 메일 중 할 일이 있는 것
    var mails = P.mailbox(c.date);
    var todays = mails.filter(function (m) { return m.date === c.date && P.taskOf(m); })
      .sort(function (a, b) { return a.time < b.time ? -1 : 1; });            // 이른 시간부터
    function drawTasks() {
      var done = todays.filter(function (m) { return P.isDone(m); }).length;
      $("taskCount").textContent = todays.length ? done + " / " + todays.length + " 완료" : "";
      $("taskBar").style.width = (todays.length ? done / todays.length * 100 : 0) + "%";
      $("tasks").innerHTML = todays.length ? todays.map(function (m, i) {
        var t = P.taskOf(m), d = P.isDone(m);
        return '<li class="' + (d ? "done" : "") + '"><input type="checkbox" id="tk' + i + '" data-i="' + i + '"' + (d ? " checked" : "") + '>' +
          '<label for="tk' + i + '"><span class="t">' + esc(t.text) + '</span><span class="m">' + P.tagPill(m.tag) + "<span>" + esc(m.time) + " · " + esc(P.sender(m.from).name) + "</span></span></label>" +
          '<span class="acts"><a class="go main" href="' + esc(t.href) + '">처리하기</a><a class="go" href="mail.html?id=' + encodeURIComponent(m.id) + '">메일</a></span></li>';
      }).join("") : '<li><span></span><span class="empty">오늘은 배정된 할 일이 없어요.</span><span></span></li>';
      Array.prototype.forEach.call($("tasks").querySelectorAll("input"), function (cb) {
        cb.addEventListener("change", function () { P.setDone(todays[+cb.dataset.i], cb.checked); drawTasks(); });
      });
      var left = todays.length - done;
      var pic = !left && todays.length ? PICS.earth : mails.some(function (m) { return m.date === c.date && /안전/.test(m.subject); }) ? PICS.safety : PICS.hello;
      $("reboPic").src = "assets/brand/" + pic[0]; $("reboPic").alt = pic[1];
      $("bubble").innerHTML = left
        ? "<b>" + esc(u.name) + "님</b>, 오늘 처리할 업무가 <b>" + left + "건</b> 남았어요." + (c.day === 1 ? '<br><span class="ink2">첫날이니까 사수님 인수인계 메일부터 읽어 봐요!</span>' : "")
        : "<b>" + esc(u.name) + "님</b>, 오늘 할 일을 모두 마쳤어요. 오늘도 지구를 지켰어요!";
    }
    drawTasks();

    // 조업 요약
    var fl = P.flagged(S);
    var maxP = Math.max.apply(null, S.heats.map(function (h) { return h.p_fail_pct; }));
    var mk = P.marketRow(c.date);
    var short = P.GRADES.filter(function (g) { return mk[g][1] < P.SHORT_T; });
    $("opsLink").href = "ops.html?date=" + c.date;
    $("tiles").innerHTML = [
      ["톤당 배합 원가", P.won(f.cost_per_t) + "원", (notice ? "통지한 배합 기준 · " : "자동 초안 기준 · ") + "숙련자 " + P.won(f.expert_cost_per_t) + "원"],
      ["톤당 절감", P.won(f.saving_per_t) + "원", "하루 약 " + (f.saving_per_t * P.tapTotal(S) / 1e6).toFixed(1) + "백만 원"],
      ["예측 최대 이탈 확률", maxP.toFixed(1) + "%", "목표 heat별 2% 이하", maxP >= 1.5],
      ["위험 로트", fl.length + "건", fl.length ? fl.map(function (x) { return P.gname(x.grade_id, S); }).join(", ") + " 조치" : "검수 메모 이상 없음", fl.length > 0],
      ["재고 부족 등급", short.length + "개", short.length ? short.map(function (g) { return P.GNAME[g] + " " + mk[g][1] + "t"; }).join(", ") : P.SHORT_T + "t 미만 없음", short.length > 0]
    ].map(function (t) { return '<div class="tile' + (t[3] ? " alert" : "") + '"><span class="k">' + t[0] + '</span><span class="v">' + t[1] + '</span><span class="s">' + esc(t[2]) + "</span></div>"; }).join("");

    // 받은 메일 미리보기
    $("mails").innerHTML = mails.slice(0, 6).map(function (m) {
      return '<li class="' + (P.isRead(m) ? "" : "unread") + '"><a href="mail.html?id=' + encodeURIComponent(m.id) + '">' + P.tagPill(m.tag) +
        '<span class="s">' + esc(m.subject) + '</span><span class="t">' + P.md(m.date) + " " + esc(m.time) + "</span></a></li>";
    }).join("") || '<li class="empty">받은 메일이 없어요.</li>';

    // 공지 (기준일까지)
    var ns = P.NOTICES.filter(function (n) { return n.date <= c.date; }).slice().reverse().slice(0, 6);
    $("notices").innerHTML = ns.map(function (n) {
      return '<li><a href="company.html#' + n.key + '"><span class="pill mute">공지</span><span class="s">' + esc(n.subject) + '</span><span class="t">' + P.md(n.date) + "</span></a></li>";
    }).join("") || '<li class="empty">공지가 없어요.</li>';
  }
  P.start(render);
})();
</script>
</body>
</html>
